<div class="job-notification-container">
  <button mat-icon-button
          class="notification-btn"
          [matBadge]="activeJobCount"
          [matBadgeHidden]="activeJobCount === 0"
          matBadgeColor="accent"
          [matMenuTriggerFor]="jobMenu">
    <div class="icon-wrapper">
      <mat-icon class="big-icon">alarm</mat-icon>
    </div>
  </button>

  <mat-menu #jobMenu="matMenu" class="job-menu" [overlapTrigger]="false">
    <div class="menu-content" (click)="$event.stopPropagation()">
      <div class="job-menu-header" (click)="$event.stopPropagation()">
        <mat-form-field appearance="fill" class="filter-field" (click)="$event.stopPropagation()">
          <mat-label>Filter by Status</mat-label>
          <mat-select [(value)]="selectedFilter">
            <mat-option value="all">All</mat-option>
            <mat-option value="waiting">Waiting</mat-option>
            <mat-option value="active">Active</mat-option>
            <mat-option value="completed">Completed</mat-option>
            <mat-option value="failed">Failed</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="job-list">
        <ng-container *ngIf="(jobs$ | async) as jobs">
          <ng-container *ngIf="getFilteredJobs(jobs).length > 0; else noJobs">
            <ng-container *ngFor="let job of getFilteredJobs(jobs); trackBy: trackByJob">
              <div class="job-item">
                <div class="job-header">
                  <div class="job-name" matTooltip="{{ job.name }}">
                    {{ job.name }}
                  </div>
                  <div class="job-icon">
                    <ng-container *ngIf="job.state === 'active'; else iconTemplate">
                      <mat-progress-spinner
                        [value]="(job.progress?.success ?? 0) / (job.progress?.total ?? 1) * 100"
                        diameter="28"
                        mode="determinate"
                        matTooltip="{{ (job | jobStatus).tooltip }}"
                        matTooltipPosition="above">
                      </mat-progress-spinner>
                    </ng-container>
                    <ng-template #iconTemplate>
                      <mat-icon
                        [ngClass]="(job | jobStatus).class"
                        matTooltip="{{ (job | jobStatus).tooltip }}"
                        matTooltipPosition="above">
                        {{ (job | jobStatus).icon }}
                      </mat-icon>
                    </ng-template>
                  </div>
                </div>
                <div class="job-details">
                  <span>Created: {{ job.createdAt | date:'short' }}</span>
                  <span *ngIf="job.completedAt">Completed: {{ job.completedAt | date:'short' }}</span>
                </div>
              </div>
            </ng-container>
          </ng-container>
          <ng-template #noJobs>
            <div class="no-jobs">No active jobs</div>
          </ng-template>
        </ng-container>
      </div>
    </div>
  </mat-menu>
</div>
