<div id="container">
  <div id="filter" *ngIf="filterStatus">
    <mat-form-field appearance="fill">
      <mat-label>Filter</mat-label>
      <mat-select [formControl]="filterStatus">
        <mat-option value="all">All</mat-option>
        <mat-option value="resolved">Resolved</mat-option>
        <mat-option value="unresolved">Unresolved</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div id="ticket-actions">
    <mat-checkbox [(ngModel)]="selectAll" (change)="toggleSelectAll()">
      Select All
    </mat-checkbox>
    <button mat-raised-button color="accent" (click)="openBulkReplyModal()"
            [disabled]="selectedTicketIds.length === 0">
      Bulk Reply ({{ selectedTicketIds.length }})
    </button>
  </div>

  <div id="tickets">
    <mat-nav-list>
      <mat-list-item *ngFor="let ticket of (tickets | async)" [routerLink]="['tickets', ticket.id]">
        <mat-checkbox [(ngModel)]="ticket.selected" (change)="onTicketSelectionChange(ticket)">
        </mat-checkbox>
        <span>{{ ticket.subject }}</span>
        <span>{{ ticket.status }}</span>
      </mat-list-item>
    </mat-nav-list>
  </div>
</div>
