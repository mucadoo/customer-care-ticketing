<div id="container">
  <div id="filter" *ngIf="filterStatus">
    <mat-form-field appearance="fill">
      <mat-label>Filter</mat-label>
      <mat-select [formControl]="filterStatus">
        <mat-option value="all">All</mat-option>
        <mat-option value="resolved">Resolved</mat-option>
        <mat-option value="unresolved">Unresolved</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div id="ticket-actions">
    <mat-checkbox [checked]="selectAll" (change)="toggleSelectAll($event)">
      {{ selectAll ? 'Unselect All' : 'Select All' }}
    </mat-checkbox>
    <button mat-raised-button color="accent"
            (click)="openBulkReplyModal()"
            [disabled]="selectedTicketIds.size < 2">
      Bulk Reply ({{ selectedTicketIds.size }})
    </button>
  </div>

  <div id="tickets">
    <mat-nav-list>
      <mat-list-item *ngFor="let ticket of (filteredTickets$ | async); trackBy: trackByTicket"
                     [routerLink]="['tickets', ticket.id]"
                     [ngClass]="{'active-link': ticket.selected}">
        <div class="ticket-row">
          <mat-checkbox [(ngModel)]="ticket.selected"
                        (change)="onTicketSelectionChange(ticket)">
          </mat-checkbox>
          <div class="ticket-details">
            <div class="ticket-subject" matTooltip="{{ ticket.subject }}">
              {{ ticket.subject }}
            </div>
            <div class="ticket-status">
              {{ ticket.status }}
            </div>
          </div>
        </div>
      </mat-list-item>
    </mat-nav-list>
  </div>
</div>
