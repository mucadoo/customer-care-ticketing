<div id="container">
  <!-- Filter Section -->
  <div id="filter" *ngIf="filterStatus">
    <mat-form-field appearance="fill">
      <mat-label>Filter</mat-label>
      <mat-select [formControl]="filterStatus">
        <mat-option value="all">All</mat-option>
        <mat-option value="resolved">Resolved</mat-option>
        <mat-option value="unresolved">Unresolved</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Actions Section -->
  <div id="ticket-actions">
    <mat-checkbox [checked]="selectAll" (change)="toggleSelectAll($event)">
      Select All
    </mat-checkbox>
    <button mat-raised-button color="accent" (click)="openBulkReplyModal()"
            [disabled]="selectedTicketIds.size < 2">
      Bulk Reply ({{ selectedTicketIds.size }})
    </button>
  </div>

  <!-- Tickets List -->
  <div id="tickets">
    <mat-nav-list>
      <mat-list-item *ngFor="let ticket of (ticketsSubject | async); trackBy: trackByTicket" [routerLink]="['tickets', ticket.id]"
                     [ngClass]="{'active-link': ticket.selected}">
        <mat-checkbox [(ngModel)]="ticket.selected" (change)="onTicketSelectionChange(ticket)">
        </mat-checkbox>
        <div class="ticket-content">
          <span class="ticket-subject" matTooltip="{{ ticket.subject }}">
            {{ ticket.subject }}
          </span>
          <span class="ticket-status">
            {{ ticket.status }}
          </span>
        </div>
      </mat-list-item>
    </mat-nav-list>
  </div>
</div>
