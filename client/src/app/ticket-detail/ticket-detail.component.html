<div class="header">
  <div class="summary">
    <div class="subject">Subject: {{ ticket.subject }}</div>
    <div class="created-on">Created on: {{ ticket.createdAt | date }}</div>
  </div>
  <button mat-stroked-button [disabled]="ticket.status === 'resolved'" (click)="onResolve()">
    Resolve ticket
  </button>
</div>
