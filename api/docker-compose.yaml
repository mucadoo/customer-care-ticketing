version: "3.8"
services:
  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: &db-user api
      POSTGRES_PASSWORD: &db-pwd apiPassword
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "api", "-d", "api"]
      interval: 1s
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    build:
      context: .
    entrypoint: [ "npm" ]
    command: [ "run", "migrate", "--", "up", "-m", "/migrations" ]
    environment:
      - DATABASE_URL=postgres://api:apiPassword@db:5432/api
    depends_on:
      - db

  seed:
    build:
      context: .
    entrypoint: [ "node" ]
    command: [ "/app/seed/index.js" ]
    environment:
      PGHOST: db
      PGUSER: *db-user
      PGPASSWORD: *db-pwd
      PGDATABASE: &database
    depends_on:
      - db

  api:
    build:
      context: .
    environment:
      PGHOST: db
      PGUSER: *db-user
      PGPASSWORD: *db-pwd
      PGDATABASE: *database
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - migrate
      - redis

  socket:
    build:
      context: .
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WS_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - migrate
      - redis
    command: [ "node", "/app/sockets/index.js" ]

  worker:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://api:apiPassword@db:5432/api
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - db
      - migrate
      - redis
    command: [ "node", "/app/workers/index.js" ]
